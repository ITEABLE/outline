# Outline's tmux settings for mirrored terminals (socket "outline"; your own tmux setup is untouched).
# The goal is that a mirrored terminal feels like a plain one.
set -g status off                 # no status bar
set -g prefix None                # no prefix key, so no tmux shortcuts get in the way
set -g escape-time 0
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:smcup@:rmcup@"   # keep the outer terminal's own scrollback working
set -ga terminal-overrides ",xterm-256color:Tc,*256col*:Tc"
set -g allow-passthrough on
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#{pane_title}"
set -g window-size latest         # whoever typed last sets the size (a terminal and Outline can differ)
set -g destroy-unattached on      # a session closes when its last terminal does
set -g mouse off
