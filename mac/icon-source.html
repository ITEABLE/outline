<!doctype html>
<html><head><style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
  .tile {
    position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px;
    background: linear-gradient(160deg, #262a31 0%, #15171b 55%, #0d0e10 100%);
    box-shadow: 0 18px 36px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.07), inset 0 3px 0 rgba(255,255,255,.08);
    overflow: hidden;
  }
  .row { position: absolute; display: flex; align-items: center; gap: 40px; }
  .dot { width: 54px; height: 54px; border-radius: 50%; }
  .bar { height: 46px; border-radius: 23px; }
  .code {
    position: absolute; left: 230px; top: 420px; width: 480px; height: 230px; border-radius: 38px;
    background: #1b1e23; box-shadow: inset 0 0 0 2px rgba(255,255,255,.06); overflow: hidden;
  }
  .code::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 20px; background: #f0c674; }
  .code span {
    position: absolute; left: 76px; top: 50%; transform: translateY(-52%);
    font: 700 128px/1 ui-monospace, Menlo, monospace; color: #8ab4f8; letter-spacing: -6px;
  }
</style></head>
<body><div class="tile">
  <div class="row" style="left:130px; top:170px"><div class="dot" style="background:#8ab4f8"></div><div class="bar" style="width:430px; background:#d9dade"></div></div>
  <div class="row" style="left:230px; top:290px"><div class="dot" style="background:#6b707a"></div><div class="bar" style="width:300px; background:#5d626c"></div></div>
  <div class="code"><span>{ }</span></div>
</div></body></html>
