<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outline</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <aside id="sidebar">
    <div class="side-head">
      <button class="new-note" id="newNote" title="New note (⌘N)">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>
        New note <kbd>⌘N</kbd>
      </button>
      <button class="tb-btn" id="appleNotes" title="Apple Notes" hidden>
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2" width="11" height="12" rx="2"/><path d="M2.5 5.5h11M5 8.5h6M5 11h4"/></svg>
      </button>
      <button class="tb-btn" id="hideSide" title="Hide sidebar (⌘\)">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6 3v10"/></svg>
      </button>
    </div>
    <div class="side-label">Notes</div>
    <ul id="tree"></ul>
    <div class="side-foot">
      <div><kbd>Tab</kbd> <kbd>⇧Tab</kbd> nest · <kbd>↵</kbd> new note · <kbd>⌘↑↓</kbd> fold</div>
      <div><kbd>⌘</kbd> click new tab · <kbd>⌥</kbd> click side by side</div>
      <div><kbd>/</kbd> blocks · <kbd>@</kbd> link a note · <kbd>⌘\</kbd> sidebar</div>
    </div>
    <div class="side-resize" id="sideResize" title="Drag to resize, double-click to reset"></div>
  </aside>
  <main class="panes" id="panes"></main>
</div>
<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
